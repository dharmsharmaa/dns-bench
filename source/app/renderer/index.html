<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNS Bench</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="drag-strip" aria-hidden="true"></div>

  <div id="app" class="app" data-screen="overview">
    <aside id="sidebar" class="sidebar"></aside>

    <section class="main">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="content" tabindex="-1"></main>
    </section>

    <aside id="inspector" class="inspector"></aside>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <script src="icons.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
